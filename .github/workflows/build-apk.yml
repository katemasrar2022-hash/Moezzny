
name: Moezzny Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "Moezzny_Flutter_Starter.zip"
      - "Moezzny-Quran-Assets.zip"
      - ".github/workflows/build-apk.yml"
      - "lib/**"
      - "assets/adhan/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          test -f Moezzny_Flutter_Starter.zip
          mkdir -p extracted
          unzip -o Moezzny_Flutter_Starter.zip -d extracted
          test -f extracted/pubspec.yaml
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted" >> "$GITHUB_ENV"

      - name: Install Quran and Adhan assets
        shell: bash
        run: |
          set -e

          test -f Moezzny-Quran-Assets.zip
          mkdir -p extracted/assets/quran
          unzip -o Moezzny-Quran-Assets.zip \
            'moezzny_quran_assets/assets/quran/*' \
            -d /tmp/moezzny-quran

          cp /tmp/moezzny-quran/moezzny_quran_assets/assets/quran/* \
            extracted/assets/quran/

          test -s assets/adhan/default_adhan.mp3
          mkdir -p extracted/assets/adhan
          cp assets/adhan/default_adhan.mp3 \
            extracted/assets/adhan/default_adhan.mp3

          test -s extracted/assets/adhan/default_adhan.mp3
          test -s extracted/assets/quran/quran-uthmani.txt
          test -s extracted/assets/quran/surah-index.json

      - name: Register Flutter assets
        working-directory: extracted
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          pubspec = Path("pubspec.yaml")
          lines = pubspec.read_text(encoding="utf-8").splitlines()

          flutter_index = next(
              (i for i, line in enumerate(lines)
               if re.match(r"^flutter:\s*(#.*)?$", line)),
              None
          )

          if flutter_index is None:
              raise SystemExit("Top-level flutter section not found")

          flutter_end = next(
              (i for i in range(flutter_index + 1, len(lines))
               if lines[i] and not lines[i][0].isspace()),
              len(lines)
          )

          assets_index = next(
              (i for i in range(flutter_index + 1, flutter_end)
               if re.match(r"^  assets:\s*(#.*)?$", lines[i])),
              None
          )

          required = [
              "    - assets/quran/",
              "    - assets/adhan/default_adhan.mp3",
          ]

          if assets_index is None:
              lines[flutter_end:flutter_end] = [
                  "  assets:",
                  *required
              ]
          else:
              insert_at = assets_index + 1

              while insert_at < flutter_end:
                  line = lines[insert_at]
                  if not line.strip() or line.startswith("    - "):
                      insert_at += 1
                  else:
                      break

              existing = set(lines[assets_index + 1:insert_at])
              missing = [
                  item for item in required
                  if item not in existing
              ]

              lines[insert_at:insert_at] = missing

          pubspec.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print("Flutter assets registered successfully.")
          PY

          grep -n -A5 '^  assets:' pubspec.yaml

      - name: Generate Android platform
        working-directory: extracted
        run: flutter create --platforms=android --project-name moezzny .

      - name: Use repository source override
        shell: bash
        run: |
          if compgen -G "lib/*.dart" > /dev/null; then
            cp lib/*.dart extracted/lib/
            echo "Using repository Dart sources"
          else
            echo "Using ZIP source"
          fi

      - name: Add prayer and location packages
        working-directory: extracted
        run: flutter pub add geolocator egyptian_prayer_times shared_preferences flutter_compass

      - name: Add notification packages
        working-directory: extracted
        run: flutter pub add flutter_local_notifications timezone flutter_timezone

      - name: Add adhan audio packages
        working-directory: extracted
        run: flutter pub add just_audio file_picker path_provider

      - name: Add location and notification permissions
        working-directory: extracted
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.SCHEDULE_EXACT_ALARM",
          ]

          for permission in permissions:
              if permission not in content:
                  tag = f'<uses-permission android:name="{permission}" />'
                  content = re.sub(
                      r"(<application\b)",
                      tag + "\n    \\1",
                      content,
                      count=1
                  )

          manifest.write_text(content, encoding="utf-8")
          print("Permissions configured.")
          PY

      - name: Configure Android SDK
        working-directory: extracted
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          gradle_file = next(
              (p for p in candidates if p.exists()),
              None
          )

          if gradle_file is None:
              raise SystemExit("Gradle file not found")

          content = gradle_file.read_text(encoding="utf-8")

          patterns = [
              r"(?m)^(\s*)compileSdk\s*=\s*.*$",
              r"(?m)^(\s*)compileSdkVersion\s+.*$",
              r"(?m)^(\s*)compileSdk\s+.*$",
          ]

          replacement = (
              r"\g<1>compileSdk = 36"
              if gradle_file.suffix == ".kts"
              else r"\g<1>compileSdk 36"
          )

          count = 0
          for pattern in patterns:
              content, count = re.subn(
                  pattern,
                  replacement,
                  content,
                  count=1
              )
              if count:
                  break

          if not count:
              raise SystemExit("compileSdk setting not found")

          gradle_file.write_text(content, encoding="utf-8")
          print("Android SDK configured.")
          PY

      - name: Enable Android core library desugaring
        working-directory: extracted
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          gradle_file = next(
              (p for p in candidates if p.exists()),
              None
          )

          if gradle_file is None:
              raise SystemExit("Gradle file not found")

          content = gradle_file.read_text(encoding="utf-8")

          if gradle_file.suffix == ".kts":
              if "isCoreLibraryDesugaringEnabled" not in content:
                  content, count = re.subn(
                      r"compileOptions\s*\{",
                      "compileOptions {\n"
                      "        isCoreLibraryDesugaringEnabled = true",
                      content,
                      count=1
                  )
                  if not count:
                      raise SystemExit("compileOptions block not found")

              dependency = (
                  'coreLibraryDesugaring('
                  '"com.android.tools:desugar_jdk_libs:2.1.5")'
              )
          else:
              if "coreLibraryDesugaringEnabled" not in content:
                  content, count = re.subn(
                      r"compileOptions\s*\{",
                      "compileOptions {\n"
                      "        coreLibraryDesugaringEnabled true",
                      content,
                      count=1
                  )
                  if not count:
                      raise SystemExit("compileOptions block not found")

              dependency = (
                  'coreLibraryDesugaring '
                  '"com.android.tools:desugar_jdk_libs:2.1.5"'
              )

          if "desugar_jdk_libs" not in content:
              content += (
                  "\n\ndependencies {\n"
                  f"    {dependency}\n"
                  "}\n"
              )

          gradle_file.write_text(content, encoding="utf-8")
          print("Desugaring configured.")
          PY

      - name: Get dependencies
        working-directory: extracted
        run: flutter pub get

      - name: Build release APK
        working-directory: extracted
        run: flutter build apk --release

      - name: Verify Adhan audio inside APK
        working-directory: extracted
        shell: bash
        run: |
          set -e
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -F \
            "assets/flutter_assets/assets/adhan/default_adhan.mp3"
          echo "Default Adhan audio verified inside APK."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Moezzny-Android-APK
          path: extracted/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
