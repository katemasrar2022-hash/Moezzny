name: Moezzny Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "Moezzny_Flutter_Starter.zip"
      - "Moezzny-Quran-Assets.zip"
      - ".github/workflows/build-apk.yml"
      - "lib/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          test -f Moezzny_Flutter_Starter.zip
          mkdir -p extracted
          unzip -o Moezzny_Flutter_Starter.zip -d extracted
          test -f extracted/pubspec.yaml
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted" >> "$GITHUB_ENV"

      - name: Install offline Quran assets
        shell: bash
        run: |
          set -e
          test -f Moezzny-Quran-Assets.zip
          mkdir -p extracted/assets/quran
          unzip -o Moezzny-Quran-Assets.zip \
            'moezzny_quran_assets/assets/quran/*' \
            -d /tmp/moezzny-quran
          cp /tmp/moezzny-quran/moezzny_quran_assets/assets/quran/* \
            extracted/assets/quran/

          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path("extracted/pubspec.yaml")
          content = pubspec.read_text(encoding="utf-8")

          if "assets/quran/" not in content:
              lines = content.splitlines(keepends=True)
              # Match only the TOP-LEVEL flutter: key, not
              # dependencies.flutter: or dev_dependencies.flutter:.
              flutter_index = next(
                  (i for i, line in enumerate(lines)
                   if line.rstrip("\r\n") == "flutter:"),
                  None
              )
              if flutter_index is None:
                  raise SystemExit("Could not find flutter: section in pubspec.yaml")

              assets_index = next(
                  (i for i in range(flutter_index + 1, len(lines))
                   if lines[i].startswith("  assets:")),
                  None
              )

              if assets_index is None:
                  lines[flutter_index + 1:flutter_index + 1] = [
                      "  assets:\n",
                      "    - assets/quran/\n",
                  ]
              else:
                  insert_index = assets_index + 1
                  while insert_index < len(lines):
                      line = lines[insert_index]
                      if line.startswith("    - ") or not line.strip():
                          insert_index += 1
                      else:
                          break
                  lines.insert(insert_index, "    - assets/quran/\n")

              pubspec.write_text("".join(lines), encoding="utf-8")

          print("Offline Quran assets copied and registered.")
          PY

          test -s extracted/assets/quran/quran-uthmani.txt
          test -s extracted/assets/quran/surah-index.json

      - name: Generate Android platform
        working-directory: extracted
        run: flutter create --platforms=android --project-name moezzny .

      - name: Use repository source override
        shell: bash
        run: |
          if compgen -G "lib/*.dart" > /dev/null; then
            cp lib/*.dart extracted/lib/
            echo "Using repository Dart sources"
          else
            echo "No repository Dart sources found; using ZIP source"
          fi

      - name: Add prayer and location packages
        working-directory: extracted
        run: flutter pub add geolocator egyptian_prayer_times shared_preferences flutter_compass

      - name: Add notification packages
        working-directory: extracted
        run: flutter pub add flutter_local_notifications timezone flutter_timezone

      - name: Add location and notification permissions
        working-directory: extracted
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml not found")

          content = manifest.read_text(encoding="utf-8")

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.SCHEDULE_EXACT_ALARM",
          ]

          for permission in permissions:
              tag = f'<uses-permission android:name="{permission}" />'
              if permission not in content:
                  content = re.sub(
                      r"(<application\b)",
                      tag + "\n    \\1",
                      content,
                      count=1
                  )

          if "<application" not in content:
              raise SystemExit("Could not find application tag in manifest")

          manifest.write_text(content, encoding="utf-8")
          print("Location and notification permissions configured.")
          PY

      - name: Configure Android SDK
        working-directory: extracted
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          gradle_file = next((p for p in candidates if p.exists()), None)
          if gradle_file is None:
              raise SystemExit("Android app Gradle file not found")

          content = gradle_file.read_text(encoding="utf-8")

          patterns = [
              r"(?m)^(\s*)compileSdk\s*=\s*.*$",
              r"(?m)^(\s*)compileSdkVersion\s+.*$",
              r"(?m)^(\s*)compileSdk\s+.*$",
          ]

          replacement = (
              r"\g<1>compileSdk = 36"
              if gradle_file.suffix == ".kts"
              else r"\g<1>compileSdk 36"
          )

          count = 0
          for pattern in patterns:
              content, count = re.subn(
                  pattern, replacement, content, count=1
              )
              if count:
                  break

          if not count:
              raise SystemExit("Could not locate compileSdk setting")

          gradle_file.write_text(content, encoding="utf-8")
          print(f"Configured compile SDK in {gradle_file}")
          PY

      - name: Enable Android core library desugaring
        working-directory: extracted
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          gradle_file = next((p for p in candidates if p.exists()), None)
          if gradle_file is None:
              raise SystemExit("Android app Gradle file not found")

          content = gradle_file.read_text(encoding="utf-8")

          if gradle_file.suffix == ".kts":
              if "isCoreLibraryDesugaringEnabled" not in content:
                  content, count = re.subn(
                      r"compileOptions\s*\{",
                      "compileOptions {\n"
                      "        isCoreLibraryDesugaringEnabled = true",
                      content,
                      count=1,
                  )
                  if count == 0:
                      raise SystemExit("compileOptions block not found")

              dependency = (
                  'coreLibraryDesugaring('
                  '"com.android.tools:desugar_jdk_libs:2.1.5")'
              )
          else:
              if "coreLibraryDesugaringEnabled" not in content:
                  content, count = re.subn(
                      r"compileOptions\s*\{",
                      "compileOptions {\n"
                      "        coreLibraryDesugaringEnabled true",
                      content,
                      count=1,
                  )
                  if count == 0:
                      raise SystemExit("compileOptions block not found")

              dependency = (
                  'coreLibraryDesugaring '
                  '"com.android.tools:desugar_jdk_libs:2.1.5"'
              )

          if "desugar_jdk_libs" not in content:
              content += (
                  "\n\ndependencies {\n"
                  f"    {dependency}\n"
                  "}\n"
              )

          gradle_file.write_text(content, encoding="utf-8")
          print("Core library desugaring configured.")
          PY

      - name: Get dependencies
        working-directory: extracted
        run: flutter pub get

      - name: Build release APK
        working-directory: extracted
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Moezzny-Android-APK
          path: extracted/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
